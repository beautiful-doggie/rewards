# Install as /etc/nginx/snippets/rewards.conf, then include it INSIDE
# the existing server block: include /etc/nginx/snippets/rewards.conf;
# The original dashboard location / can stay in the same server block.
location = /rewards {
    return 308 /rewards/;
}

location ^~ /rewards/ {
        # No trailing slash: preserve /rewards/ when proxying to Next.js.
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 60s;
}
